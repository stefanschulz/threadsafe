# Limits like a modest shared host, for threadsafe-restore.php and threadsafe-backup.php only (the file is mounted into the target web container by docker-compose.yml):
# the restore wizard (docs/PHASE3.md 4.2 and 6) and the backup tool (docs/PHASE12.md 4.2) have to work in requests of 5 seconds and with 64 MB of memory.
# The shop itself keeps the limits of the image.
<FilesMatch "^threadsafe-(restore|backup)\.php$">
    php_value max_execution_time 5
    php_value memory_limit 64M
</FilesMatch>
