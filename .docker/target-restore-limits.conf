# Limits like a modest shared host, for threadsafe-restore.php only (the file is mounted into the target web container by docker-compose.yml):
# the restore wizard has to work in requests of 5 seconds and with 64 MB of memory (docs/PHASE3.md 4.2 and 6). The shop itself keeps
# the limits of the image.
<Files "threadsafe-restore.php">
    php_value max_execution_time 5
    php_value memory_limit 64M
</Files>
