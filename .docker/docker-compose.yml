# Development/test environment: PrestaShop 9 + MariaDB + Mailpit.
# Port range 819x so that nothing collides with other local projects.
#
#   cp .env.example .env        (once, optional)
#   docker compose up -d        (the first start installs PrestaShop and takes a few minutes)
#   Shop:     http://localhost:8190      Back office: http://localhost:8190/admin-dev
#   Mailpit:  http://localhost:8191
name: threadsafe-dev

services:
  prestashop:
    image: prestashop/prestashop:${PS_TAG:-9.0.2-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PS_PORT:-8190}:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: ${DB_PASSWORD:-prestashop}
      DB_PREFIX: ps_
      PS_DOMAIN: localhost:${PS_PORT:-8190}
      PS_INSTALL_AUTO: "1"
      PS_ERASE_DB: "0"
      PS_LANGUAGE: de
      PS_COUNTRY: DE
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install
      PS_ENABLE_SSL: "0"
      PS_DEV_MODE: "0"
      ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-Admin1234!}
    volumes:
      - ps_data:/var/www/html

  # The database server is MariaDB 10.11 by default; DB_IMAGE=mysql:8.4 with VOLUME_SUFFIX=_mysql (see
  # tests/stack/matrix.sh) runs the same stack on MySQL. The MYSQL_* variables are understood by both images.
  db:
    image: ${DB_IMAGE:-mariadb:10.11}
    environment:
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: ${DB_PASSWORD:-prestashop}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prestashop}
    healthcheck:
      # MariaDB 11 images have mariadb-admin only, MySQL images mysqladmin; over TCP it fails while the entrypoint's temporary server runs.
      test: ["CMD-SHELL", "if command -v mariadb-admin >/dev/null 2>&1; then A=mariadb-admin; else A=mysqladmin; fi; $$A ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8191}:8025"
    networks: [default, target]

  # --- Target stack (profile "target") -------------------------------------------------------------------------
  # Receives a clone of the source shop (tests/stack/clone.sh) and is then migrated. It lives in its own network
  # on purpose: the cloned parameters.php still says "database host: db", and in this network "db" does not exist,
  # so the clone can never talk to the source database by accident. Before the migration it is broken in exactly
  # the way a restored copy is.
  target-db:
    profiles: ["target"]
    # the same server as the source, unless TARGET_DB_IMAGE says otherwise (tests/stack/cross.sh: a backup from MySQL onto MariaDB and back)
    image: ${TARGET_DB_IMAGE:-${DB_IMAGE:-mariadb:10.11}}
    environment:
      MYSQL_DATABASE: prestashop_target
      MYSQL_USER: target
      MYSQL_PASSWORD: ${TARGET_DB_PASSWORD:-target}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prestashop}
    healthcheck:
      # MariaDB 11 images have mariadb-admin only, MySQL images mysqladmin; over TCP it fails while the entrypoint's temporary server runs.
      test: ["CMD-SHELL", "if command -v mariadb-admin >/dev/null 2>&1; then A=mariadb-admin; else A=mysqladmin; fi; $$A ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - target_db_data:/var/lib/mysql
    networks: [target]

  target-prestashop:
    profiles: ["target"]
    image: prestashop/prestashop:${PS_TAG:-9.0.2-apache}
    # Only Apache + PHP: no installer, the files arrive through the clone script. mod_headers is on because the dev mode
    # sends X-Robots-Tag through .htaccess.
    command: ["sh", "-c", "a2enmod headers >/dev/null && exec apache2-foreground"]
    ports:
      - "${TARGET_PORT:-8290}:80"
    volumes:
      - target_ps_data:/var/www/html
      # tight limits for restore.php only, see the file
      - ./target-restore-limits.conf:/etc/apache2/conf-enabled/threadsafe-restore-limits.conf:ro
    networks: [target]

  # The web interface of ThreadSafe itself (profile "web"; docs/PHASE4.md 4.2): Apache and PHP 8.4 (the image of the shops), the program
  # directory read-only, the source shop read-only (a profile can point at /shops/source; its database is "db" in this network), a data
  # volume and a storage volume that the tools container mounts as well (to read audit logs and archives, and to damage them). Port 80
  # has the document root on public/, port 81 has the whole program directory below the web root. Limits: 5 seconds, 64 MB.
  web:
    profiles: ["web"]
    image: prestashop/prestashop:${PS_TAG:-9.0.2-apache}
    command: ["sh", "-c", "a2dissite -q 000-default && a2ensite -q threadsafe-web && a2enmod -q headers rewrite env && chown www-data:www-data /srv/data /srv/storage && exec apache2-foreground"]
    ports:
      - "${WEB_PORT:-8390}:80"
      - "${WEB_TREE_PORT:-8391}:81"
    volumes:
      - ..:/srv/threadsafe:ro
      - ./web-site.conf:/etc/apache2/sites-available/threadsafe-web.conf:ro
      - web_data:/srv/data
      - web_storage:/srv/storage
      - ps_data:/shops/source:ro
    depends_on:
      db:
        condition: service_healthy

  # Development tools (PHP 8.4 CLI + pdo_mysql + Composer). Not started by `up`; use:
  #   docker compose --profile tools run --rm tools composer install
  #   docker compose --profile tools run --rm tools composer check
  tools:
    profiles: ["tools"]
    build: ./php
    working_dir: /app
    volumes:
      - ..:/app
      - composer_cache:/composer
      # The shop files of both stacks, so that the integration tests can run the migration against them.
      - ps_data:/shops/source:ro
      - target_ps_data:/shops/target
      # the data and the storage of the web interface (service "web"), to prepare and read them
      - web_data:/web-data
      - web_storage:/web-storage
    depends_on:
      db:
        condition: service_healthy
    networks: [default, target]

networks:
  default: {}
  target: {}

# The names are the usual ones of project "threadsafe-dev"; VOLUME_SUFFIX=_mysql (tests/stack/matrix.sh) gives the stack
# for the other database server its own volumes without a second project (which would need new Docker networks).
volumes:
  ps_data:
    name: threadsafe-dev_ps_data${VOLUME_SUFFIX:-}
  db_data:
    name: threadsafe-dev_db_data${VOLUME_SUFFIX:-}
  target_ps_data:
    name: threadsafe-dev_target_ps_data${VOLUME_SUFFIX:-}
  target_db_data:
    name: threadsafe-dev_target_db_data${TARGET_DB_SUFFIX:-${VOLUME_SUFFIX:-}}
  web_data:
    name: threadsafe-dev_web_data${VOLUME_SUFFIX:-}
  web_storage:
    name: threadsafe-dev_web_storage${VOLUME_SUFFIX:-}
  composer_cache:
