# Development/test environment: PrestaShop 9 + MariaDB + Mailpit.
# Port range 819x so that nothing collides with other local projects.
#
#   cp .env.example .env        (once, optional)
#   docker compose up -d        (the first start installs PrestaShop and takes a few minutes)
#   Shop:     http://localhost:8190      Back office: http://localhost:8190/admin-dev
#   Mailpit:  http://localhost:8191
name: threadsafe-dev

services:
  prestashop:
    image: prestashop/prestashop:${PS_TAG:-9.0.2-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PS_PORT:-8190}:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: ${DB_PASSWORD:-prestashop}
      DB_PREFIX: ps_
      PS_DOMAIN: localhost:${PS_PORT:-8190}
      PS_INSTALL_AUTO: "1"
      PS_ERASE_DB: "0"
      PS_LANGUAGE: de
      PS_COUNTRY: DE
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install
      PS_ENABLE_SSL: "0"
      PS_DEV_MODE: "0"
      ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-Admin1234!}
    volumes:
      - ps_data:/var/www/html

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: ${DB_PASSWORD:-prestashop}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prestashop}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8191}:8025"
    networks: [default, target]

  # --- Target stack (profile "target") -------------------------------------------------------------------------
  # Receives a clone of the source shop (tests/stack/clone.sh) and is then migrated. It lives in its own network
  # on purpose: the cloned parameters.php still says "database host: db", and in this network "db" does not exist,
  # so the clone can never talk to the source database by accident. Before the migration it is broken in exactly
  # the way a restored copy is.
  target-db:
    profiles: ["target"]
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: prestashop_target
      MARIADB_USER: target
      MARIADB_PASSWORD: ${TARGET_DB_PASSWORD:-target}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prestashop}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - target_db_data:/var/lib/mysql
    networks: [target]

  target-prestashop:
    profiles: ["target"]
    image: prestashop/prestashop:${PS_TAG:-9.0.2-apache}
    # Only Apache + PHP: no installer, the files arrive through the clone script. mod_headers is on because the dev mode
    # sends X-Robots-Tag through .htaccess.
    command: ["sh", "-c", "a2enmod headers >/dev/null && exec apache2-foreground"]
    ports:
      - "${TARGET_PORT:-8290}:80"
    volumes:
      - target_ps_data:/var/www/html
    networks: [target]

  # Development tools (PHP 8.4 CLI + pdo_mysql + Composer). Not started by `up`; use:
  #   docker compose --profile tools run --rm tools composer install
  #   docker compose --profile tools run --rm tools composer check
  tools:
    profiles: ["tools"]
    build: ./php
    working_dir: /app
    volumes:
      - ..:/app
      - composer_cache:/composer
      # The shop files of both stacks, so that the integration tests can run the migration against them.
      - ps_data:/shops/source:ro
      - target_ps_data:/shops/target
    depends_on:
      db:
        condition: service_healthy
    networks: [default, target]

networks:
  default: {}
  target: {}

volumes:
  ps_data:
  db_data:
  target_ps_data:
  target_db_data:
  composer_cache:
