# The web interface of ThreadSafe for the Docker test stack (service "web"; docs/PHASE4.md 4.2).
#
#   :80  the layout the documentation recommends: the document root is public/, so that src/, data/, vendor/ ... are not served at all.
#   :81  the weaker layout: the whole program directory below the web root, protected only by the .htaccess files.
#
# Limits like a modest shared host: the interface has to work in requests of 5 seconds and with 64 MB of memory, which makes a backup
# of the source shop (about 650 MB) take many steps.
Listen 81

<VirtualHost *:80>
    ServerName web
    DocumentRoot /srv/threadsafe/public
    SetEnv THREADSAFE_DATA /srv/data
    <Directory /srv/threadsafe/public>
        AllowOverride All
        Require all granted
        php_value max_execution_time 5
        php_value memory_limit 64M
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:81>
    ServerName web
    DocumentRoot /srv/threadsafe
    SetEnv THREADSAFE_DATA /srv/data
    <Directory /srv/threadsafe>
        AllowOverride All
        Require all granted
        php_value max_execution_time 5
        php_value memory_limit 64M
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
