# Limits like a modest shared host, for every request to the host "fresh" (docs/PHASE7.md 4.2): 5 seconds and 64 MB. The installer and the update
# have to work inside them. The image's own configuration allows .htaccess files below /var/www (AllowOverride All).
<Directory /var/www>
    php_value max_execution_time 5
    php_value memory_limit 64M
</Directory>
