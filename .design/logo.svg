<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ThreadSafe logo. The grammar of the other applications of this author (SetLister): the graphite tile, one shape in outline, and a brass disc with a
     graphite rim that steps out of it. Here the shape is the door of a safe (the backup is kept safe: hinges, a combination dial) and the disc is the
     restore: a counter-clockwise arrow around clock hands. Colours are the tokens of docs/DESIGN.md: graphite #1b232c, brass #e0a13d. The mark is moved
     by (-190, -220) so that the safe and the disc together sit in the middle of the tile. -->
<svg width="100%" height="100%" viewBox="0 0 4500 4500" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <rect x="225" y="225" width="4050" height="4050" rx="141.667" style="fill:#1b232c;"/>
    <g transform="translate(-190,-220)">
        <!-- the door, with its two hinges -->
        <rect x="1080" y="1020" width="2340" height="2340" rx="120" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
        <rect x="960" y="1380" width="190" height="320" rx="41.667" style="fill:#e0a13d;"/>
        <rect x="960" y="2680" width="190" height="320" rx="41.667" style="fill:#e0a13d;"/>
        <!-- the combination dial -->
        <circle cx="1950" cy="1830" r="450" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
        <path d="M1950,1380 L1950,1460 M1950,2200 L1950,2280 M1500,1830 L1580,1830 M2320,1830 L2400,1830" style="fill:none;stroke:#e0a13d;stroke-width:90px;"/>
        <circle cx="1950" cy="1830" r="150" style="fill:#e0a13d;"/>
        <!-- the disc: restore -->
        <circle cx="3260" cy="3300" r="640" style="fill:#e0a13d;stroke:#1b232c;stroke-width:100px;"/>
        <path d="M3472.1,3047.2 A330,330 0 1 0 3493.3,3533.3" style="fill:none;stroke:#1b232c;stroke-width:110px;"/>
        <path d="M3260,3170 L3260,3300 L3365,3360" style="fill:none;stroke:#1b232c;stroke-width:95px;"/>
        <path d="M3670.1,3356.6 L3645.4,3685.4 L3341.3,3381.3 Z" style="fill:#1b232c;stroke:#1b232c;stroke-width:40px;"/>
    </g>
</svg>
