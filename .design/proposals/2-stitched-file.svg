<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ThreadSafe, proposal 2: the stitched file. A brass page with a folded corner (the backup), a running stitch along its edge (the thread), and,
     stepping out of the page with a graphite rim like SetLister's play disc, the seal of the check (safe, verified). -->
<svg width="100%" height="100%" viewBox="0 0 4500 4500" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <rect x="225" y="225" width="4050" height="4050" rx="141.667" style="fill:#1b232c;"/>
    <!-- the page with the folded corner -->
    <path d="M1250,1000 L2700,1000 L3250,1550 L3250,3500 L1250,3500 Z" style="fill:#e0a13d;stroke:#e0a13d;stroke-width:66.67px;"/>
    <path d="M2700,1000 L2700,1550 L3250,1550" style="fill:none;stroke:#1b232c;stroke-width:66.67px;"/>
    <!-- the running stitch -->
    <rect x="1560" y="1850" width="1380" height="1330" rx="60" style="fill:none;stroke:#1b232c;stroke-width:66.67px;stroke-dasharray:210 175;"/>
    <!-- the seal -->
    <circle cx="3180" cy="3300" r="560" style="fill:#e0a13d;stroke:#1b232c;stroke-width:100px;stroke-linecap:butt;"/>
    <path d="M2930,3300 L3100,3470 L3440,3090" style="fill:none;stroke:#1b232c;stroke-width:110px;"/>
</svg>
