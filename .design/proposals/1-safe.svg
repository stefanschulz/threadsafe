<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ThreadSafe, proposal 1: the safe. SetLister's grammar: graphite tile, a brass frame in outline, a brass disc that steps out of the frame with a graphite rim.
     Here the frame is the door of a safe with a combination dial, and a thread runs out of it and ends in a knot. -->
<svg width="100%" height="100%" viewBox="0 0 4500 4500" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <rect x="225" y="225" width="4050" height="4050" rx="141.667" style="fill:#1b232c;"/>
    <!-- the door -->
    <rect x="1080" y="1020" width="2340" height="2340" rx="120" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
    <!-- two hinges on the left edge -->
    <rect x="960" y="1380" width="190" height="320" rx="41.667" style="fill:#e0a13d;"/>
    <rect x="960" y="2680" width="190" height="320" rx="41.667" style="fill:#e0a13d;"/>
    <!-- the dial -->
    <circle cx="2250" cy="2190" r="650" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
    <path d="M2250,1530 L2250,1620 M2250,2760 L2250,2850 M1590,2190 L1680,2190 M2820,2190 L2910,2190" style="fill:none;stroke:#e0a13d;stroke-width:100px;"/>
    <circle cx="2250" cy="2190" r="210" style="fill:#e0a13d;"/>
    <path d="M2250,2190 L2250,2070" style="fill:none;stroke:#1b232c;stroke-width:80px;"/>
    <!-- the thread out of the door, ending in a knot that steps out of the frame like SetLister's disc -->
    <path d="M2860,3360 C2860,3760 3360,3560 3360,3960" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
    <circle cx="3360" cy="3900" r="260" style="fill:#e0a13d;stroke:#1b232c;stroke-width:66.67px;"/>
</svg>
