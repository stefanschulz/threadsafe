<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ThreadSafe, proposal 3: the spool. Two flanges and a wound core in brass, the winding in graphite; the loose end of the thread runs out and ends
     in a small disc with a graphite rim, the one gesture SetLister's mark has. The shape also reads as a log roll or a tape: a backup that is wound up. -->
<svg width="100%" height="100%" viewBox="0 0 4500 4500" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <defs>
        <clipPath id="core"><rect x="1650" y="1260" width="1200" height="1980"/></clipPath>
    </defs>
    <rect x="225" y="225" width="4050" height="4050" rx="141.667" style="fill:#1b232c;"/>
    <!-- flanges -->
    <rect x="1330" y="1000" width="1840" height="270" rx="70" style="fill:#e0a13d;"/>
    <rect x="1330" y="3230" width="1840" height="270" rx="70" style="fill:#e0a13d;"/>
    <!-- core with the winding -->
    <rect x="1650" y="1260" width="1200" height="1980" style="fill:#e0a13d;"/>
    <g clip-path="url(#core)" style="fill:none;stroke:#1b232c;stroke-width:80px;stroke-linecap:butt;">
        <path d="M1500,1440 L3000,1740 M1500,1760 L3000,2060 M1500,2080 L3000,2380 M1500,2400 L3000,2700 M1500,2720 L3000,3020 M1500,3040 L3000,3340"/>
    </g>
    <!-- the loose end -->
    <path d="M2850,2380 C3450,2380 3500,2980 3380,3400 C3320,3600 3440,3760 3560,3800" style="fill:none;stroke:#e0a13d;stroke-width:66.67px;"/>
    <circle cx="3600" cy="3800" r="240" style="fill:#e0a13d;stroke:#1b232c;stroke-width:66.67px;"/>
</svg>
